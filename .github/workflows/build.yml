name: Build Boards

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bread-compact-wifi-128x64:
    name: Build Bread Compact WiFi 128x64
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Bread Compact WiFi 128x64
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi-128x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-wifi-128x64_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
