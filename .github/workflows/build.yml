name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: list
        name: Get all variant list
        run: |
          echo "all_variants=$(python scripts/build.py --list-boards --json)" >> $GITHUB_OUTPUT

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          ALL_VARIANTS: ${{ steps.list.outputs.all_variants }}
        run: |
          EVENT_NAME="${{ github.event_name }}"

          if [[ "$EVENT_NAME" == "push" ]]; then
            VARIANTS=$(echo "$ALL_VARIANTS" | python -c "import sys, json; data=json.load(sys.stdin); print(json.dumps(data[:5]))")
            echo "variants=$VARIANTS" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_SHA="HEAD^1"
          HEAD_SHA="HEAD^2"
          echo "Base: $(git rev-parse "$BASE_SHA"), Head: $(git rev-parse "$HEAD_SHA")"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo -e "Changed files:\n$CHANGED"

          SELECTED=$(printf '%s\n' "$CHANGED" | python scripts/build.py --select-changed)
          echo "variants=$SELECTED" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

  esp32s31-idf61:
    name: Build ${{ matrix.full_name }} with IDF 6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: espressif/esp32-s31-function-coreboard-1
            name: esp32-s31-function-coreboard-1
            full_name: espressif-esp32-s31-function-coreboard-1
          - board: espressif/esp32-s31-korvo-1
            name: esp32-s31-korvo-1
            full_name: espressif-esp32-s31-korvo-1
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S31 variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
